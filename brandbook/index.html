<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bridgemaker — Brandbook v2.0</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { background: var(--off-white); }
  code { font-family: "JetBrains Mono", Menlo, monospace; }
  /* Sektionsgrenzen: 1px surface-stone (Kanon §2). Die erste Sektion
     nach einem Werkgruppen-Header trägt keine eigene Linie — der
     Header bringt seine mit (sonst Doppellinie). */
  .bb-section { border-top: 1px solid var(--surface-stone); }
  .bb-group + .bb-section { border-top: none; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="section-logo.jsx"></script>
<script type="text/babel" src="section-type.jsx"></script>
<script type="text/babel" src="section-colors.jsx"></script>
<script type="text/babel" src="section-surfaces.jsx"></script>
<script type="text/babel" src="section-kasane.jsx"></script>
<script type="text/babel" src="section-components.jsx"></script>
<script type="text/babel" src="section-patterns.jsx"></script>
<script type="text/babel" src="section-produkt-ui.jsx"></script>
<script type="text/babel" src="section-rules.jsx"></script>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function Brandbook() {
  const sections = [
    { header: "A, Marke" },
    { id: "story", label: "Story" },
    { id: "logo", label: "Logo" },
    { id: "voice", label: "Voice" },
    { header: "B, Fundament" },
    { id: "colors", label: "Farben" },
    { id: "type", label: "Typografie" },
    { id: "display", label: "Display" },
    { id: "layout", label: "Layout & Motion" },
    { header: "C, Flächen" },
    { id: "surfaces", label: "Cards & Glass" },
    { id: "kasane", label: "Kasane & Gradients" },
    { header: "D, Anwendung" },
    { id: "components", label: "Components" },
    { id: "landing", label: "Seitenrhythmus" },
    { id: "produkt-ui", label: "Produkt-UIs (shadcn)" },
    { id: "slides", label: "Slides" },
    { header: "E, System" },
    { id: "tokens", label: "Tokens" },
    { id: "claude", label: "Claude" },
    { header: "F, Work in progress" },
    { id: "imagery", label: "Imagery" },
  ];
  const flat = sections.filter(s => s.id);
  const [active, setActive] = useState("story");
  const jump = (id) => {
    setActive(id);
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) setActive(e.target.id);
    }, { rootMargin: "-30% 0px -60% 0px" });
    flat.forEach(s => { const el = document.getElementById(s.id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  return (
    <>
      <BbNav sections={sections} active={active} onJump={jump} />
      <BbHero />
      <div style={{ maxWidth: 1200, margin: "0 auto", padding: "0 48px 120px" }}>
        <BbGroupHeader letter="A" label="Marke" />
        <BbStorySection />
        <BbLogoSection />
        <BbVoiceSection />
        <BbGroupHeader letter="B" label="Fundament" />
        <BbColorsSection />
        <BbTypeSection />
        <BbDisplaySection />
        <BbLayoutSection />
        <BbGroupHeader letter="C" label="Flächen" />
        <BbSurfacesSection />
        <BbKasaneSection />
        <BbGroupHeader letter="D" label="Anwendung" />
        <BbComponentsSection />
        <BbLandingSection />
        <BbProductUiSection />
        <BbSlidesSection />
        <BbGroupHeader letter="E" label="System" />
        <BbTokensSection />
        <BbClaudeSection />
        <BbGroupHeader letter="F" label="Work in progress" />
        <BbImagerySection />

        <div style={{ borderTop: "1px solid #C5C0B8", paddingTop: 40, marginTop: 40, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 16 }}>
          <div style={{ font: "var(--text-small)", color: "#918F87" }}>Bridgemaker GmbH, 2026</div>
          <div style={{ font: "var(--text-small)", color: "#918F87" }}>Brandbook v2.0, Kanon: guidelines/, Quelle: Website-Design-System</div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Brandbook />);
</script>
</body>
</html>
